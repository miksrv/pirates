name: Deploy

# Автодеплой на push отключён: деплой запускается вручную из вкладки Actions.
on:
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build client
        env:
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
        run: npm run build

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/deploy
          chmod 400 ~/.ssh/deploy
          cat >>~/.ssh/config <<END
          Host vps
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy
            StrictHostKeyChecking no
          END

      - name: Send client build
        env:
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: |
          ssh vps "mkdir -p $SSH_PATH && rm -rf $SSH_PATH/dist"
          rsync -avz -e ssh dist/ vps:$SSH_PATH/dist

      # server/data (SQLite stats) is gitignored and stays out of this sync, so it survives redeploys.
      - name: Send server + shared source
        env:
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: |
          rsync -avz -e ssh --exclude 'data' server/ vps:$SSH_PATH/server
          rsync -avz -e ssh shared/ vps:$SSH_PATH/shared
          rsync -avz -e ssh package.json package-lock.json tsconfig.json ecosystem.config.js vps:$SSH_PATH/

      # better-sqlite3 has native bindings, so deps are installed on the VPS itself rather than
      # shipped from the runner (matching architecture/Node ABI).
      - name: Install server dependencies on VPS
        env:
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: ssh vps "cd $SSH_PATH && npm ci"

      - name: Restart PM2
        env:
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: ssh vps "cd $SSH_PATH && pm2 startOrReload ecosystem.config.js --update-env && pm2 save"
