name: Deploy

# Автодеплой на push отключён: VPS слишком мал, чтобы держать pirates постоянно поднятым рядом
# с критичными проектами — деплой запускается вручную из вкладки Actions, когда нужно.
on:
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build client
        env:
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
        run: npm run build

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/deploy
          chmod 400 ~/.ssh/deploy
          cat >>~/.ssh/config <<END
          Host vps
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy
            StrictHostKeyChecking no
          END

      - name: Send client build
        run: |
          ssh vps "mkdir -p /var/www/pirates.miksoft.pro && rm -rf /var/www/pirates.miksoft.pro/dist"
          rsync -avz -e ssh dist/ vps:/var/www/pirates.miksoft.pro/dist

      # server/data (SQLite stats) is gitignored and stays out of this sync, so it survives redeploys.
      - name: Send server + shared source
        run: |
          rsync -avz -e ssh --exclude 'data' server/ vps:/var/www/pirates.miksoft.pro/server
          rsync -avz -e ssh shared/ vps:/var/www/pirates.miksoft.pro/shared
          rsync -avz -e ssh package.json package-lock.json tsconfig.json ecosystem.config.cjs vps:/var/www/pirates.miksoft.pro/

      # better-sqlite3 has native bindings, so deps are installed on the VPS itself rather than
      # shipped from the runner (matching architecture/Node ABI).
      - name: Install server dependencies on VPS
        run: ssh vps "cd /var/www/pirates.miksoft.pro && npm ci"

      - name: Restart PM2
        run: ssh vps "cd /var/www/pirates.miksoft.pro && pm2 startOrReload ecosystem.config.cjs --update-env && pm2 save"
