upstream pirates_client {
  server 127.0.0.1:3010;
}

upstream pirates_server {
  server 127.0.0.1:8081;
}

server {
    listen 80;
    listen [::]:80;

    server_name pirates.miksoft.pro;

    server_tokens off;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/css application/javascript image/svg+xml;

    # WebSocket game server + login/profile/status API (see server/index.ts).
    # Trailing slash on proxy_pass strips the /ws/ prefix before forwarding.
    location /ws/ {
        proxy_pass http://pirates_server/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;

        # Rounds run for minutes - keep the WebSocket alive past nginx's default 60s.
        proxy_read_timeout 3600;
    }

    # Static client, served via `serve` under PM2 (see ecosystem.config.js).
    location / {
        proxy_pass http://pirates_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
